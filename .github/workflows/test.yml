name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q main.py interview_builder.py minutes_builder.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build container
        run: docker build -t stelic-docx-builder:test .
